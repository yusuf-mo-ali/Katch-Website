<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Page Not Found — Katch</title>
  <style>
    @font-face{font-family:Manrope;src:url('/fonts/manrope-600.woff2') format('woff2');font-weight:600;font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:#11110f;color:#fffefa;font-family:Manrope,Arial,sans-serif}body{min-height:100svh;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:84px 84px}.wrap{width:min(100%,1540px);min-height:100svh;margin:auto;padding:28px clamp(20px,4vw,64px) 56px;display:flex;flex-direction:column}.logo{width:116px}.logo img{width:100%;filter:invert(1)}main{margin:auto 0}.label{color:#d7ff4f;font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{margin:24px 0 18px;font-size:clamp(64px,10vw,160px);line-height:.88;letter-spacing:-.075em}p{max-width:480px;color:#a7a79e;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}.actions a{min-height:54px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:space-between;gap:36px;border:1px solid rgba(255,255,250,.2);border-radius:999px;color:#fff;text-decoration:none;font-size:12px}.actions a:first-child{color:#11110f;background:#d7ff4f;border-color:#d7ff4f}@media(max-width:560px){body{background-size:54px 54px}.wrap{padding-top:22px}.logo{width:106px}h1{font-size:clamp(60px,18vw,88px)}.actions{flex-direction:column}.actions a{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="/" aria-label="Katch home"><img src="/katch-logo-sm.webp" alt="Katch" width="262" height="66"></a>
    <main>
      <div class="label">404 / Wrong turn</div>
      <h1>Page not found.</h1>
      <p>The page may have moved, or the address may not be quite right.</p>
      <div class="actions"><a href="/">Back Home <span>↘</span></a><a href="/work">View Our Work <span>↘</span></a></div>
    </main>
  </div>
</body>
</html>
